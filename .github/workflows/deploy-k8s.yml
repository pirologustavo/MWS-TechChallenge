name: Deploy Laravel API to EKS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Monolito
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Instalar Dependências (Composer)
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: ☁️ Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 🐳 Build e Push da Imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mws-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: ☸️ Configurar Kubeconfig
        run: aws eks update-kubeconfig --name mws-cluster --region us-east-1

      - name: 🚀 Atualizar Pods no EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mws-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/mws-api-deployment mws-api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG