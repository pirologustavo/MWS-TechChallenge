name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - Cliente-lv
          - Veiculo-lv
          - Estoque-lv
          - Funcionario-lv
          - Os-lv

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: pcov
          tools: phpstan


      - name: Install dependencies
        working-directory: Microservicos-lv/php84/${{ matrix.service }}
        run: composer install --prefer-dist --no-progress


      - name: Run tests and collect coverage
        working-directory: Microservicos-lv/php84/${{ matrix.service }}
        run: php artisan test --coverage-clover=coverage.xml

      - name: Check code style
        working-directory: Microservicos-lv/php84/${{ matrix.service }}
        run: vendor/bin/pint --test app tests

      - name: Static analysis
        working-directory: Microservicos-lv/php84/${{ matrix.service }}
        run: phpstan analyse app --level=1 --no-progress --autoload-file=vendor/autoload.php

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: Microservicos-lv/php84/${{ matrix.service }}/coverage.xml
          if-no-files-found: error
