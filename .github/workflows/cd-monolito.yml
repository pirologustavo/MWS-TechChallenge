name: CD - Monolito

on:
  workflow_run:
    workflows: [Laravel CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    uses: ./.github/workflows/cd-service.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      context: ./Monolito
      repository: monolito
      deployment_containers: '{"monolito-deployment":"monolito"}'
      watch_paths: '["Monolito","k8s/monolito.yaml"]'
    secrets: inherit
