services:
  monolito:
    build:
      context: ./Monolito
      dockerfile: Dockerfile
    container_name: mws-monolito
    ports:
      - "8080:80"
    environment:
      OS_APPROVAL_SECRET: ${OS_APPROVAL_SECRET:-local-approval-secret-change-me}
      LOG_CHANNEL: stderr
      DD_SERVICE: monolito
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz.php"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./Monolito/mws:/var/www/html
    networks:
      - mws-network

  db:
    image: mysql:8.0
    container_name: mws-db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
    environment:
      MYSQL_DATABASE: mws_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    networks:
      - mws-network
    volumes:
      - mws_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: mysql:8.0
    container_name: mws-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      CLIENTE_DB_PASSWORD: ${CLIENTE_DB_PASSWORD:-local-cliente-change-me}
      VEICULO_DB_PASSWORD: ${VEICULO_DB_PASSWORD:-local-veiculo-change-me}
      ESTOQUE_DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-local-estoque-change-me}
      FUNCIONARIO_DB_PASSWORD: ${FUNCIONARIO_DB_PASSWORD:-local-funcionario-change-me}
      OS_DB_PASSWORD: ${OS_DB_PASSWORD:-local-os-change-me}
    volumes:
      - ./scripts/provision-service-databases.sh:/provision-service-databases.sh:ro
    entrypoint: ["bash", "/provision-service-databases.sh"]
    network_mode: "service:db"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mws-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mws}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mws-local-change-me}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mws-network

  cliente-lv-api:
    build:
      context: ./Microservicos-lv/php84/Cliente-lv
    container_name: cliente-lv-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      LOG_CHANNEL: stderr
      DD_SERVICE: cliente-lv
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cliente_db
      DB_USERNAME: cliente_app
      DB_PASSWORD: ${CLIENTE_DB_PASSWORD:-local-cliente-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8001:80"
    volumes:
      - ./Microservicos-lv/php84/Cliente-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - cliente-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  veiculo-lv-api:
    build:
      context: ./Microservicos-lv/php84/Veiculo-lv
    container_name: veiculo-lv-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      LOG_CHANNEL: stderr
      DD_SERVICE: veiculo-lv
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: veiculo_db
      DB_USERNAME: veiculo_app
      DB_PASSWORD: ${VEICULO_DB_PASSWORD:-local-veiculo-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8002:80"
    volumes:
      - ./Microservicos-lv/php84/Veiculo-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - veiculo-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  estoque-lv-api:
    build:
      context: ./Microservicos-lv/php84/Estoque-lv
    container_name: estoque-lv-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      LOG_CHANNEL: stderr
      DD_SERVICE: estoque-lv
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: estoque_db
      DB_USERNAME: estoque_app
      DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-local-estoque-change-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mws}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mws-local-change-me}
      RABBITMQ_VHOST: /
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8003:80"
    volumes:
      - ./Microservicos-lv/php84/Estoque-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - estoque-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  estoque-lv-saga-worker:
    extends:
      service: estoque-lv-api
    container_name: estoque-lv-saga-worker
    command: ["sh", "-c", "php artisan migrate --force && (php artisan saga:publish-outbox &) && exec php artisan saga:consume-stock-adjustments"]
    ports: []
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  funcionario-lv-api:
    build:
      context: ./Microservicos-lv/php84/Funcionario-lv
    container_name: funcionario-lv-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      LOG_CHANNEL: stderr
      DD_SERVICE: funcionario-lv
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: funcionario_db
      DB_USERNAME: funcionario_app
      DB_PASSWORD: ${FUNCIONARIO_DB_PASSWORD:-local-funcionario-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8004:80"
    volumes:
      - ./Microservicos-lv/php84/Funcionario-lv:/var/www/html
    networks:
      mws-network:
        aliases:
            - funcionario-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  os-lv-api:
    build:
      context: ./Microservicos-lv/php84/Os-lv
    container_name: os-lv-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      LOG_CHANNEL: stderr
      DD_SERVICE: os-lv
      DD_ENV: ${DD_ENV:-local}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-}
      DD_LOGS_INJECTION: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: os_db
      DB_USERNAME: os_app
      DB_PASSWORD: ${OS_DB_PASSWORD:-local-os-change-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mws}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mws-local-change-me}
      RABBITMQ_VHOST: /
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      OS_APPROVAL_SECRET: ${OS_APPROVAL_SECRET:-local-approval-secret-change-me}
      MONOLITO_URL: ${MONOLITO_URL:-http://localhost:8080}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8005:80"
    volumes:
      - ./Microservicos-lv/php84/Os-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - os-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  os-lv-saga-worker:
    extends:
      service: os-lv-api
    container_name: os-lv-saga-worker
    command: ["sh", "-c", "php artisan migrate --force && (php artisan saga:publish-outbox &) && (while true; do php artisan saga:report-stuck --minutes=5; sleep 60; done &) && exec php artisan saga:consume-stock-results"]
    ports: []
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mws-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mws-network

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: mws-datadog-agent
    profiles: [observability]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_ENV: ${DD_ENV:-local}
    ports:
      - "8126:8126/tcp"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - mws-network

networks:
  mws-network:
    driver: bridge

volumes:
  mws_db_data:
  rabbitmq_data:
