services:
  monolito:
    build:
      context: ./Monolito
      dockerfile: Dockerfile
    container_name: mws-monolito
    ports:
      - "8080:80"
    environment:
      OS_APPROVAL_SECRET: ${OS_APPROVAL_SECRET:-local-approval-secret-change-me}
    volumes:
      - ./Monolito/mws:/var/www/html
    networks:
      - mws-network

  db:
    image: mysql:8.0
    container_name: mws-db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
    environment:
      MYSQL_DATABASE: mws_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    networks:
      - mws-network
    volumes:
      - mws_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: mysql:8.0
    container_name: mws-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      CLIENTE_DB_PASSWORD: ${CLIENTE_DB_PASSWORD:-local-cliente-change-me}
      VEICULO_DB_PASSWORD: ${VEICULO_DB_PASSWORD:-local-veiculo-change-me}
      ESTOQUE_DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-local-estoque-change-me}
      FUNCIONARIO_DB_PASSWORD: ${FUNCIONARIO_DB_PASSWORD:-local-funcionario-change-me}
      OS_DB_PASSWORD: ${OS_DB_PASSWORD:-local-os-change-me}
    volumes:
      - ./scripts/provision-service-databases.sh:/provision-service-databases.sh:ro
    entrypoint: ["bash", "/provision-service-databases.sh"]
    network_mode: "service:db"

  cliente-lv-api:
    build:
      context: ./Microservicos-lv/php84/Cliente-lv
    container_name: cliente-lv-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cliente_db
      DB_USERNAME: cliente_app
      DB_PASSWORD: ${CLIENTE_DB_PASSWORD:-local-cliente-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8001:80"
    volumes:
      - ./Microservicos-lv/php84/Cliente-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - cliente-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  veiculo-lv-api:
    build:
      context: ./Microservicos-lv/php84/Veiculo-lv
    container_name: veiculo-lv-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: veiculo_db
      DB_USERNAME: veiculo_app
      DB_PASSWORD: ${VEICULO_DB_PASSWORD:-local-veiculo-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8002:80"
    volumes:
      - ./Microservicos-lv/php84/Veiculo-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - veiculo-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  estoque-lv-api:
    build:
      context: ./Microservicos-lv/php84/Estoque-lv
    container_name: estoque-lv-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: estoque_db
      DB_USERNAME: estoque_app
      DB_PASSWORD: ${ESTOQUE_DB_PASSWORD:-local-estoque-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8003:80"
    volumes:
      - ./Microservicos-lv/php84/Estoque-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - estoque-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  funcionario-lv-api:
    build:
      context: ./Microservicos-lv/php84/Funcionario-lv
    container_name: funcionario-lv-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: funcionario_db
      DB_USERNAME: funcionario_app
      DB_PASSWORD: ${FUNCIONARIO_DB_PASSWORD:-local-funcionario-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8004:80"
    volumes:
      - ./Microservicos-lv/php84/Funcionario-lv:/var/www/html
    networks:
      mws-network:
        aliases:
            - funcionario-lv
    depends_on:
      db-init:
        condition: service_completed_successfully

  os-lv-api:
    build:
      context: ./Microservicos-lv/php84/Os-lv
    container_name: os-lv-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: os_db
      DB_USERNAME: os_app
      DB_PASSWORD: ${OS_DB_PASSWORD:-local-os-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      OS_APPROVAL_SECRET: ${OS_APPROVAL_SECRET:-local-approval-secret-change-me}
      MONOLITO_URL: ${MONOLITO_URL:-http://localhost:8080}
      CLIENTE_API_URL: http://cliente-lv
      VEICULO_API_URL: http://veiculo-lv
      FUNCIONARIO_API_URL: http://funcionario-lv
      ESTOQUE_API_URL: http://estoque-lv
    ports:
      - "8005:80"
    volumes:
      - ./Microservicos-lv/php84/Os-lv:/var/www/html
    networks:
      mws-network:
        aliases:
          - os-lv
    depends_on:
      db-init:
        condition: service_completed_successfully
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mws-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mws-network

networks:
  mws-network:
    driver: bridge

volumes:
  mws_db_data:
