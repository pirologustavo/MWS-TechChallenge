    - -c
    - (php artisan saga:publish-outbox &) && exec php artisan saga:consume-stock-adjustments
  runner:
    image: python:3.12-alpine
    volumes:
    - ./run.py:/run.py:ro
    entrypoint:
    - python
    - /run.py
    profiles:
    - test
