name: CI - Cliente-lv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-test-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: integration-test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://root:integration-test@127.0.0.1:27017/?authSource=admin
      MONGODB_DATABASE: cliente_audit_test
      MONGODB_TIMEOUT_MS: 5000

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, mongodb, sockets
          coverage: pcov
          tools: phpstan
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run tests with Clover coverage
        run: php artisan test --coverage-clover=coverage.xml
      - name: Verify real MongoDB audit persistence
        run: php vendor/bin/phpunit tests/Integration/ClienteAuditMongoTest.php
      - name: Enforce 80% service coverage
        run: python3 scripts/check_coverage.py coverage.xml --minimum 80
      - name: Check style
        run: vendor/bin/pint --test app tests
      - name: Static quality analysis
        run: phpstan analyse app --level=1 --memory-limit=512M --no-progress --autoload-file=vendor/autoload.php
      - name: Build service image
        run: docker build --tag cliente-lv:ci .
