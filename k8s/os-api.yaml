apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-lv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-lv
  template:
    metadata:
      labels:
        app: os-lv
    spec:
      containers:
        - name: os-lv
          image: pirolo/os-api:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mws-config

            - secretRef:
                name: mws-os-service-secret
          env:
            - name: DB_DATABASE
              value: os_db
            - name: CLIENTE_API_URL
              value: http://cliente-lv
            - name: VEICULO_API_URL
              value: http://veiculo-lv
            - name: FUNCIONARIO_API_URL
              value: http://funcionario-lv
            - name: ESTOQUE_API_URL
              value: http://estoque-lv
            - name: MONOLITO_URL
              value: https://mws.example.com
            - name: APP_URL
              value: "http://localhost:8080"
            - name: ASSET_URL
              value: "http://localhost:8080"
            - name: TRUSTED_PROXIES
              value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: os-lv
spec:
  selector:
    app: os-lv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
