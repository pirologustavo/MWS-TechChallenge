apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque-lv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: estoque-lv
  template:
    metadata:
      labels:
        app: estoque-lv
    spec:
      containers:
        - name: estoque-lv
          image: pirolo/estoque-api:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mws-config

            - secretRef:
                name: mws-estoque-service-secret
          env:
            - name: DB_DATABASE
              value: estoque_db
            - name: CLIENTE_API_URL
              value: http://cliente-lv
            - name: VEICULO_API_URL
              value: http://veiculo-lv
            - name: FUNCIONARIO_API_URL
              value: http://funcionario-lv
            - name: ESTOQUE_API_URL
              value: http://estoque-lv
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-lv
spec:
  selector:
    app: estoque-lv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
