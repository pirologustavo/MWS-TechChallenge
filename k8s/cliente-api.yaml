apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente-lv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliente-lv
  template:
    metadata:
      labels:
        app: cliente-lv
    spec:
      containers:
        - name: cliente-lv
          image: pirolo/cliente-api:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mws-config

            - secretRef:
                name: mws-cliente-service-secret
          env:
            - name: DB_DATABASE
              value: cliente_db
            - name: CLIENTE_API_URL
              value: http://cliente-lv
            - name: VEICULO_API_URL
              value: http://veiculo-lv
            - name: FUNCIONARIO_API_URL
              value: http://funcionario-lv
            - name: ESTOQUE_API_URL
              value: http://estoque-lv
---
apiVersion: v1
kind: Service
metadata:
  name: cliente-lv
spec:
  selector:
    app: cliente-lv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
