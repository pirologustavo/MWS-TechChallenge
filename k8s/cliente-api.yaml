apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente-lv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliente-lv
  template:
    metadata:
      labels:
        app: cliente-lv
        tags.datadoghq.com/service: cliente-lv
        tags.datadoghq.com/env: prod
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: mongo:8.0
          envFrom:
            - secretRef:
                name: mws-cliente-service-secret
          command:
            - sh
            - -c
            - until mongosh "$MONGODB_URI" --quiet --eval 'db.runCommand({ ping: 1 }).ok'; do sleep 2; done
      containers:
        - name: cliente-lv
          image: pirolo/cliente-api:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: mws-config

            - secretRef:
                name: mws-cliente-service-secret
          env:
            - name: LOG_CHANNEL
              value: stderr
            - name: DD_SERVICE
              value: cliente-lv
            - name: DD_ENV
              value: prod
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DB_DATABASE
              value: cliente_db
            - name: CLIENTE_API_URL
              value: http://cliente-lv
            - name: VEICULO_API_URL
              value: http://veiculo-lv
            - name: FUNCIONARIO_API_URL
              value: http://funcionario-lv
            - name: ESTOQUE_API_URL
              value: http://estoque-lv
---
apiVersion: v1
kind: Service
metadata:
  name: cliente-lv
spec:
  selector:
    app: cliente-lv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
