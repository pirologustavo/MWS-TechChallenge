apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolito-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolito
  template:
    metadata:
      labels:
        app: monolito
        tags.datadoghq.com/service: monolito
        tags.datadoghq.com/env: prod
    spec:
      containers:
        - name: monolito
          image: pirolo/monolito:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz.php
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: mws-config

          env:
            - name: LOG_CHANNEL
              value: stderr
            - name: DD_SERVICE
              value: monolito
            - name: DD_ENV
              value: prod
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: OS_APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: mws-os-service-secret
                  key: OS_APPROVAL_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: monolito-service
spec:
  type: LoadBalancer
  selector:
    app: monolito
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
