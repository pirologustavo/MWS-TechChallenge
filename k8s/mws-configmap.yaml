apiVersion: v1
kind: ConfigMap
metadata:
  name: mws-config
  namespace: default
data:
  DB_CONNECTION: mysql
  # Point to the shared MySQL/RDS host; provision one schema/user per API.
  DB_HOST: "replace-with-mysql-rds-endpoint"
  DB_PORT: "3306"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"

  APP_URL: "http://localhost:8080"

  MAIL_MAILER: smtp
  MAIL_HOST: mailhog
  MAIL_PORT: "1025"
  MAIL_USERNAME: "null"
  MAIL_PASSWORD: "null"
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: "sistema@mws.com.br"
  MAIL_FROM_NAME: "Sistema MWS"
